name: Update skills.sh badge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read install count from skills.sh
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          URL = "https://skills.sh/renosaza/codex-proj-docs-okf"
          OUT = Path(".github/badges/skills-sh.json")

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "codex-proj-docs-OKF badge updater"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")

          parser = TextExtractor()
          parser.feed(html)
          text = " ".join(" ".join(parser.parts).split())

          match = re.search(r"([0-9][0-9,]*)\s+total installs\b", text, re.IGNORECASE)
          if not match:
              raise SystemExit("Could not find '<N> total installs' on skills.sh; keeping the previous badge.")

          installs = int(match.group(1).replace(",", ""))
          payload = {
              "schemaVersion": 1,
              "label": "skills.sh",
              "message": f"{installs:,} installs",
              "color": "111111",
          }
          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"skills.sh installs: {installs}")
          PY

      - name: Commit changed badge data
        run: |
          if git diff --quiet -- .github/badges/skills-sh.json; then
            echo "Badge count unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/skills-sh.json
          git commit -m "chore: update skills.sh install badge"
          git push
