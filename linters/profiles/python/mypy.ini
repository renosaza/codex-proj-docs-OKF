[mypy]
strict = True
disallow_any_explicit = True
disallow_any_unimported = True
warn_unreachable = True
warn_unused_configs = True
show_error_codes = True
enable_error_code = ignore-without-code,redundant-expr,truthy-bool,truthy-iterable,unused-awaitable,explicit-override,mutable-override,exhaustive-match
